# 각 group_vars들의 이름과 인벤토리(hosts.ini)에서 설정한 그룹의 이름을 동일하게 맞추면 됨
# group_vars/all.yml
---
# 유저 및 경로 설정
ansible_user: ansible-admin
base_dir: "/home/ansible-admin/project"
git_dir: "{{ base_dir }}/git/music-project.git"

# 권한 설정 변수
jenkins_uid: "1000"
target_gid: "1002"

# 파이프라인 내부 변수
ansible_bin_path: "/usr/bin/ansible-playbook"
python_path: "/home/ansible-admin/.local/lib/python3.9/site-packages"

# --- 서비스 실행 계정 - 모니터링  ----
prometheus_user: "prometheus"
loki_user: "loki"         
promtail_user: "root"         
node_exporter_user: "root"    
node_exporter_port: 9100
prometheus_datasource_uid: Prometheus

# --- 패키지 버전 ---
node_exporter_ver: "1.7.0"
promtail_ver: "2.9.2"
prometheus_ver: "2.48.0"
loki_ver: "2.9.2"
grafana_ver: "10.2.2"
blackbox_exporter_ver: "0.24.0"

# --- 모니터링 공통 설정 ---
monitoring_server_ip: "10.4.5.10"
load_balancer_external_ip: "172.16.6.82"

